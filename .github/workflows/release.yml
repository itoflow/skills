name: Release

# Each new plugin version on main is published as a release, itoflow--v<version>.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check manifests, skills and published content
        run: node scripts/validate.mjs

      - name: Check the version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          case "$version" in
            *-*) echo "::error::Releases need a plain version, not $version"; exit 1 ;;
          esac

      - name: Build archive
        id: build
        run: node scripts/package.mjs "$RUNNER_TEMP/dist"

      - name: Check the extracted archive
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/extracted/itoflow"
          unzip -q -d "$RUNNER_TEMP/extracted/itoflow" "$ARCHIVE"
          cp scripts/validate.mjs "$RUNNER_TEMP/validate.mjs"
          node "$RUNNER_TEMP/validate.mjs" "$RUNNER_TEMP/extracted/itoflow"
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate --strict "$RUNNER_TEMP/extracted/itoflow"

      - name: Check the OpenAI package
        env:
          OPENAI_ZIP: ${{ steps.build.outputs.openai }}
        run: |
          # The directory accepts the Codex format only, without apps or hooks.
          files=$(unzip -Z1 "$OPENAI_ZIP" | grep -v '/$' | sort)
          echo "$files"
          for required in .codex-plugin/plugin.json .mcp.json skills/itoflow/SKILL.md skills/worker/SKILL.md assets/logo.svg; do
            grep -qx "$required" <<< "$files" || { echo "::error::$required is missing from the OpenAI package"; exit 1; }
          done
          if grep -E '^(plugin\.json|mcp\.json|\.app\.json|hooks/)' <<< "$files"; then
            echo "::error::The OpenAI package must hold only the Codex format"
            exit 1
          fi

      - name: Check the skill packages
        run: |
          # Apps that upload one skill expect SKILL.md at the root of the ZIP.
          for zip in "$RUNNER_TEMP"/dist/*-skill-*.zip; do
            unzip -Z1 "$zip" | grep -qx SKILL.md || { echo "::error::$(basename "$zip") has no SKILL.md at its root"; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          VERSION: ${{ steps.build.outputs.version }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          OPENAI_ZIP: ${{ steps.build.outputs.openai }}
        run: |
          # A plugin change always carries a new version, so a published tag
          # means this push changed only repository files such as the README.
          # A draft is what an interrupted upload leaves; replace it.
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" = false ]; then
              echo "::notice::$TAG is already released; nothing to publish."
              exit 0
            fi
            echo "::warning::Replacing the unfinished draft release $TAG."
            gh release delete "$TAG" --yes
          fi

          notes="Install from GitHub with the commands in the README. $(basename "$ARCHIVE") is the plugin with every client's manifest; unzipped, it is also a local marketplace. $(basename "$OPENAI_ZIP") is for ChatGPT's Upload plugin archive, and each -skill- ZIP holds one skill for apps that upload skills."
          # Only the current head of main becomes latest, so a re-run of an
          # older build cannot move releases/latest/download/itoflow.zip back.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" -q .object.sha)
          latest=false
          [ "$head" = "$GITHUB_SHA" ] && latest=true
          # Every versioned file, plus a copy without the version, such as
          # itoflow.zip, so releases/latest/download/<name> links keep working.
          files=("$RUNNER_TEMP"/dist/*)
          mkdir "$RUNNER_TEMP/latest"
          for file in "$RUNNER_TEMP"/dist/*.zip; do
            name=$(basename "$file")
            cp "$file" "$RUNNER_TEMP/latest/${name/-$VERSION/}"
          done
          gh release create "$TAG" "${files[@]}" "$RUNNER_TEMP"/latest/* \
            --target "$GITHUB_SHA" --title "Itoflow plugin $VERSION" --notes "$notes" --latest="$latest"
